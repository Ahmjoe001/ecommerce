<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>e-commerce-product</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <header>
    <div class="logo">
      <img  src="./images/logo.svg" alt="this is  logo">
    </div>
    <div class="collectoin">
      <p>Collection</p>
      <p>Men</p>
      <p>Women</p>
      <p>Contact</p>
    </div>
    <div class="header-end">
      <img class="icon" src="./images/icon-cart.svg" alt="this is an icon">
      <img class="icon" src="./images/image-avatar.png" alt=" this is an icon">

    </div>
  </header>
  <hr>
<main>
  <section>
    <img class="main-image"  src="./images/first.jpg" alt="this is an image">
    <div class="grid">
      <img class="goods" src="./images/image-product-1-thumbnail.jpg" alt="this is an image">
      <img class="goods" src="./images/image-product-2-thumbnail.jpg" alt="this is an image">
      <img class="goods" src="./images/image-product-3-thumbnail.jpg" alt="this is an image">
      <img class="goods" src="./images/image-product-4-thumbnail.jpg" alt="this is an image">
    </div>
  </section>
   <div class="text">
    <p>SNEAKER COMPANY</p>  
    <h1 style="margin-bottom: 50px;">Fall Limited Edition <br> Sneakers</h1>
    <p>These low-profile sneakers are your perfect casual wear <br> companion. Featuring a durable rubber outer sole, they'll <br> withstand everything the weather can offer.</p>
    <div class="price">
      <h2 style="margin-bottom: 30px;">$ 125.00</h2>
      <button>50%</button>
   </div>
  <h4 style="margin-bottom: 40px;">$250.00</h4>
  <div class="pay">
    <div class="add">
    <img class="minus" src="./images/icon-minus.svg" alt="this is an icon">
    <p class="pp">0</p>
    <img class="plus" src="./images/icon-plus.svg" alt="this is an icon">
    
  </div>
    <div class="cart">
      <img  class="car" src="./images/icon-cart.svg" alt="This is an icon">
      <h3>Add to cart</h3>

    </div>
  
  
</main>
  
<div class="active">
  
  <!-- <img class="active-site" src="./design/active-states-lightbox.jpg" alt="this is an active site">
  <img src="./design/active-states-basket-filled.jpg" alt=" this is an active site">
  <img src="./design/active-states-basket-empty.jpg" alt="this is an active site"> -->

</div>

</body>
</html>
